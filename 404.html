<style>/* Prompta landing — tokens mirror the app (ios/Prompta/Theme/PromptaColors.swift) */
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--surface-2:#F1F1EE;--text:#16171A;--text-2:#5A5B60;--text-3:#6E6F76;
  --border:#E5E4DF;--brand:#5B4BD6;--brand-text:#5B4BD6;--brand-soft:#EFECFF;--brand-line:#D9D3FF;
  --accent:#FFC94A;--on-accent:#1B1640;--hero-1:#7563F2;--hero-2:#5B47E0;--hero-3:#4936C4;
  --shadow:0 1px 2px rgba(22,23,26,.04),0 8px 24px rgba(22,23,26,.06);
  --r:20px;--wrap:1160px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E0F10;--surface:#18191C;--surface-2:#141517;--text:#F4F3F0;--text-2:#A6A7AD;--text-3:#8B8C93;
  --border:#2A2B30;--brand:#7C6CF6;--brand-text:#A996FF;--brand-soft:#1F1C38;--brand-line:#3A3370;
  --hero-1:#5A49D6;--hero-2:#4433B8;--hero-3:#2E2289;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:76px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:var(--brand-text)}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.narrow{max-width:820px}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--text-3)}
.small{font-size:13px}
.center{text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* skip link + language suggestion */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.suggest{position:fixed;z-index:60;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:12px 48px 12px 18px;background:var(--text);color:var(--bg);font-size:14px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}}
@media (prefers-reduced-motion:reduce){.suggest{animation:none}}
.suggest[hidden]{display:none}
.suggest a{color:var(--bg);font-weight:700}
.suggest button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:inherit;padding:8px;cursor:pointer;border-radius:8px;display:flex}

/* header */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand img{border-radius:8px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:var(--text-2);text-decoration:none;font-size:15px;font-weight:500;padding:8px 12px;border-radius:10px}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.lang{position:relative}
.lang summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 10px;border-radius:10px;color:var(--text-2);font-size:14px;font-weight:600}
.lang summary::-webkit-details-marker{display:none}
.lang summary:hover{background:var(--surface-2);color:var(--text)}
.lang .chev{width:16px;height:16px;transition:transform .2s}
.lang[open] .chev{transform:rotate(180deg)}
.lang ul{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.lang li a{display:block;padding:9px 12px;border-radius:9px;color:var(--text);text-decoration:none;font-size:15px}
.lang li a:hover{background:var(--surface-2)}
.lang li a[aria-current]{color:var(--brand-text);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 18px}
.btn:hover{filter:brightness(1.08)}
.btn-sm{padding:9px 14px;font-size:14px}
@media (max-width:880px){.nav{display:none}.lang{margin-left:auto}}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,var(--hero-1) 0%,var(--hero-2) 52%,var(--hero-3) 100%);scroll-margin-top:64px}
.rings{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(circle at 78% 46%,transparent 0 179px,rgba(255,255,255,.10) 180px 181px,transparent 182px 299px,rgba(255,255,255,.08) 300px 301px,transparent 302px 439px,rgba(255,255,255,.06) 440px 441px,transparent 442px 599px,rgba(255,255,255,.05) 600px 601px,transparent 602px)}
.hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-top:72px;padding-bottom:80px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:7px 14px;border-radius:999px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,201,74,.25)}
.hero h1{font-size:clamp(38px,5.6vw,66px);font-weight:850;letter-spacing:-.035em;margin:22px 0 20px;text-wrap:balance}
mark{background:var(--accent);color:var(--on-accent);padding:0 .16em;border-radius:.18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.lead{font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:rgba(255,255,255,.9);max-width:560px;text-wrap:pretty}
.stores{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.store{display:inline-flex;align-items:center;gap:10px;min-width:184px;height:56px;padding:0 18px 0 14px;border-radius:14px;background:#000;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28);transition:transform .15s ease,box-shadow .15s ease}
a.store:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.store .logo{width:26px;height:26px;flex:none}
.store span{display:flex;flex-direction:column;line-height:1.1}
.store small{font-size:11px;font-weight:500;letter-spacing:.02em;opacity:.9}
.store b{font-size:21px;font-weight:600;letter-spacing:-.01em}
.store.is-soon{opacity:.62;cursor:default}
.store.is-soon small{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
html.is-android .store-google{order:-1}
.trust{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;font-size:15px;font-weight:600;color:rgba(255,255,255,.92)}
.trust li{display:flex;align-items:center;gap:6px}
.trust .ic{width:18px;height:18px;color:var(--accent);stroke-width:2.6}
.hero-art{display:flex;justify-content:center}
@media (max-width:960px){
  .hero-in{grid-template-columns:1fr;padding-top:48px;padding-bottom:56px;gap:40px;text-align:center}
  .hero-copy{display:flex;flex-direction:column;align-items:center}
  .lead{margin:0 auto}.stores,.trust{justify-content:center}
  .rings{background-position:0 18%}
}

/* phone mock — matches the app's teleprompter screen */
.phone{width:300px;height:620px;border-radius:50px;padding:10px;background:linear-gradient(145deg,#2c2c30,#0b0b0d);box-shadow:0 0 0 2px rgba(255,255,255,.12) inset,0 40px 80px rgba(16,8,60,.45),0 12px 24px rgba(16,8,60,.3);transform:rotate(-4deg)}
.screen{position:relative;height:100%;border-radius:41px;overflow:hidden;background:#1c1b21;color:#fff;font-family:var(--font)}
.glow{position:absolute;inset:0;background:radial-gradient(60% 40% at 20% 75%,rgba(178,120,60,.55),transparent 70%),radial-gradient(50% 35% at 90% 85%,rgba(60,140,90,.45),transparent 70%),radial-gradient(70% 50% at 60% 30%,rgba(120,110,140,.35),transparent 70%)}
.island{position:absolute;top:10px;left:50%;width:96px;height:28px;margin-left:-48px;border-radius:20px;background:#000;box-shadow:0 0 0 2px var(--accent);z-index:3}
.status{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 26px 0;font-size:14px;font-weight:600;height:44px}
.sig{display:flex;align-items:flex-end;gap:2px;height:12px}
.sig i{width:3px;background:#fff;border-radius:1px}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:9px}.sig i:nth-child(4){height:12px}
.topbar{position:relative;display:flex;align-items:center;gap:10px;padding:10px 16px 0}
.round{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.round .ic{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.4);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600}
.pill i{width:7px;height:7px;border-radius:50%;background:#9c9da1}
.chips{position:relative;display:flex;gap:6px;padding:12px 16px 0;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.chips span{padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.4)}
.chips .on{background:#7C6CF6}
.script{position:relative;height:300px;margin-top:10px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 14%,#000 80%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 14%,#000 80%,transparent 100%)}
.line{position:absolute;left:10px;right:10px;top:46px;height:92px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);z-index:1}
.roll{position:relative;z-index:2;padding:52px 22px 0;font-size:19px;line-height:1.48;font-weight:500;animation:roll 22s cubic-bezier(.45,0,.55,1) infinite}
.roll p{margin-bottom:22px}
.panel{position:absolute;left:8px;right:8px;bottom:8px;border-radius:28px;background:rgba(20,20,24,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 12px 14px}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:14px;padding:4px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7)}
.seg span{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:3px;padding:7px 6px;border-radius:10px;white-space:nowrap;overflow:hidden}
.seg .ic{width:13px;height:13px}
.seg .on{background:#7C6CF6;color:#fff}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:34px;margin:8px 0 4px;animation:listen 22s cubic-bezier(.45,0,.55,1) infinite}
.wave i{width:3px;height:26px;border-radius:2px;background:#A996FF;transform-origin:center;animation:bar 1.1s ease-in-out infinite alternate}
.wave i:nth-child(3n){animation-delay:-.3s;animation-duration:.9s}
.wave i:nth-child(3n+1){animation-delay:-.6s;animation-duration:1.3s}
.wave i:nth-child(4n){animation-delay:-.15s;animation-duration:.75s}
.wave i:nth-child(5n){animation-delay:-.45s}
.rec{width:54px;height:54px;margin:2px auto 0;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.rec span{width:40px;height:40px;border-radius:50%;background:#FF3B30}
/* Voice mode story: speak (text moves, wave active) → pause (text holds, wave flat) → repeat */
@keyframes roll{
  0%,6%{transform:translateY(0);opacity:1}
  22%,32%{transform:translateY(-96px)}
  50%,60%{transform:translateY(-218px)}
  78%,90%{transform:translateY(-330px);opacity:1}
  96%{transform:translateY(-330px);opacity:0}
  97%{transform:translateY(0);opacity:0}
  100%{transform:translateY(0);opacity:1}
}
@keyframes listen{
  0%,5%{transform:scaleY(.18);opacity:.45}
  8%,20%{transform:scaleY(1);opacity:1}
  23%,31%{transform:scaleY(.18);opacity:.45}
  35%,48%{transform:scaleY(1);opacity:1}
  51%,59%{transform:scaleY(.18);opacity:.45}
  63%,76%{transform:scaleY(1);opacity:1}
  79%,100%{transform:scaleY(.18);opacity:.45}
}
@keyframes bar{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.roll,.wave,.wave i{animation:none}}
@media (max-width:960px){.phone{transform:none}}
@media (max-width:380px){.phone{width:272px;height:570px}.script{height:262px}}

/* use cases */
.uses{padding:44px 0;border-bottom:1px solid var(--border)}
.uses h2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);text-align:center}
.uses ul{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.uses li{padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:15px}

/* sections */
.sec{padding:96px 0}
.sec-alt{background:var(--surface-2)}
.sh{max-width:720px;margin:0 auto 48px;text-align:center}
.kicker{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text);margin-bottom:12px}
.sh h2,.priv h2{font-size:clamp(30px,3.8vw,46px);font-weight:800;text-wrap:balance}
.sub{font-size:18px;color:var(--text-2);margin-top:16px;text-wrap:pretty}
.fine{font-size:13.5px;color:var(--text-3);margin-top:28px;max-width:820px}
.fine.center{margin-left:auto;margin-right:auto}
@media (max-width:640px){.sec{padding:68px 0}.sh{margin-bottom:36px}}

/* modes */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mode{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;box-shadow:var(--shadow)}
.mode-hl{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--shadow);position:relative}
.mode-ic,.card-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand-text);margin-bottom:18px}
.mode-ic .ic,.card-ic .ic{width:24px;height:24px}
.mode h3,.card h3{font-size:21px;font-weight:750}
.tag{display:inline-block;margin:10px 0 12px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.tag-pro{background:var(--accent);color:var(--on-accent);border-color:transparent}
.mode p:last-child,.card p{color:var(--text-2)}
@media (max-width:880px){.modes{grid-template-columns:1fr}}

/* features */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px}
.card h3{margin-bottom:10px}
@media (max-width:960px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}

/* gallery */
.gal{position:relative}
.gal-track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px max(20px,calc((100vw - var(--wrap))/2 + 20px)) 24px;scrollbar-width:none;overscroll-behavior-x:contain}
.gal-track::-webkit-scrollbar{display:none}
.gal-track li{flex:none;width:260px;scroll-snap-align:center}
.gal-track img{width:100%;height:auto;border-radius:22px;box-shadow:var(--shadow);background:var(--brand-soft)}
.gal-btn{position:absolute;top:calc(50% - 32px);z-index:2;width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gal-btn:disabled{opacity:0;pointer-events:none}
.gal-btn.prev{left:max(12px,calc((100vw - var(--wrap))/2 - 12px))}
.gal-btn.next{right:max(12px,calc((100vw - var(--wrap))/2 - 12px))}
@media (max-width:640px){.gal-btn{display:none}.gal-track li{width:min(240px,68vw)}}

/* how */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.steps li{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px}
.num{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:18px;margin-bottom:18px}
.steps h3{font-size:21px;font-weight:750;margin-bottom:10px}
.steps p{color:var(--text-2)}
@media (min-width:881px){.steps li:not(:last-child)::after{content:"";position:absolute;top:47px;right:-21px;width:22px;height:2px;background:var(--brand-line)}}
@media (max-width:880px){.steps{grid-template-columns:1fr}}

/* privacy */
.priv{display:grid;grid-template-columns:auto 1fr 1fr;gap:32px 40px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:44px;box-shadow:var(--shadow)}
.priv-ic{width:72px;height:72px;border-radius:22px;background:linear-gradient(145deg,var(--hero-1),var(--hero-3));color:#fff;display:flex;align-items:center;justify-content:center}
.priv-ic .ic{width:36px;height:36px}
.priv h2{font-size:clamp(26px,3vw,36px)}
.priv .sub{font-size:16.5px}
.priv ul{display:grid;gap:12px}
.priv li,.plan li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.priv li .ic,.plan li .ic{color:var(--brand-text);margin-top:2px;stroke-width:2.4}
@media (max-width:960px){.priv{grid-template-columns:1fr;padding:32px 24px}}

/* pricing */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:0 auto}
.plan{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px}
.plan h3{font-size:26px;font-weight:800}
.plan-tag{color:var(--text-2);margin:6px 0 22px;font-weight:600}
.plan ul{display:grid;gap:12px}
.plan li{font-weight:500}
.plan-pro{border:2px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),var(--surface) 46%)}
.plan-pro h3{color:var(--brand-text)}
@media (max-width:760px){.plans{grid-template-columns:1fr}}

/* faq */
.faq{display:grid;gap:12px}
.faq details{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:0 22px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-weight:700;font-size:17.5px}
.faq summary::-webkit-details-marker{display:none}
.faq .chev{color:var(--text-3);transition:transform .2s}
.faq details[open] .chev{transform:rotate(180deg)}
.faq details p{color:var(--text-2);padding-bottom:22px;margin-top:-4px}

/* final cta */
.cta{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,var(--hero-1),var(--hero-3));text-align:center}
.cta .rings{background-position:-28vw 10%}
.cta-in{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:88px;padding-bottom:96px}
.cta img{border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.25);margin-bottom:24px}
.cta h2{font-size:clamp(32px,4.4vw,52px);font-weight:850;letter-spacing:-.03em;text-wrap:balance}
.cta p{font-size:19px;color:rgba(255,255,255,.88);margin-top:14px;max-width:560px}
.cta .stores{justify-content:center}

/* footer */
.foot{padding:64px 0 32px;font-size:15px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1.3fr 1fr;gap:32px}
.foot-brand p{color:var(--text-2);margin-top:12px;max-width:260px}
.foot h2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px}
.foot ul{display:grid;gap:10px}
.foot li{display:flex;flex-wrap:wrap;gap:4px 10px}
.foot nav a{color:var(--text);text-decoration:none}
.foot nav a:hover{color:var(--brand-text);text-decoration:underline}
.pair{color:var(--text-3)}
.pair a{font-weight:600}
.foot .small{margin-top:12px}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);color:var(--text-3);font-size:14px}
.foot .foot-langs{display:flex;flex-wrap:wrap;gap:6px 16px}
.foot-langs a{color:var(--text-2);text-decoration:none}
.foot-langs a[aria-current]{color:var(--text);font-weight:700}
@media (max-width:880px){.foot-grid{grid-template-columns:1fr 1fr}.foot-brand{grid-column:1/-1}}
@media (max-width:480px){.foot-grid{grid-template-columns:1fr}}

/* 404 */
.nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;gap:14px}
.nf img{border-radius:18px;margin-bottom:8px}
.nf h1{font-size:36px}
.nf p{color:var(--text-2)}
.nf ul{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:10px}
</style>
</head>
